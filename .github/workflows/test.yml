name: test

on:
  push:
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x bin/claude install.sh uninstall.sh test/run.sh
      - run: ./test/run.sh

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x bin/claude install.sh uninstall.sh test/run.sh
      - run: ./test/run.sh

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./test/windows.ps1
